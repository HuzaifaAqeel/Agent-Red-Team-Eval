[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-red-team-eval"
version = "0.4.0"
description = "Security evaluation harness for AI agents: prompt-injection and tool-exfiltration red-team probes."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Huzaifa Aqeel" },
]
keywords = ["security", "ai-safety", "red-team", "evaluation", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "AgentTinman>=0.1.60",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
redteam-eval = "redteam_eval.cli:main"

[project.urls]
Homepage = "https://github.com/HuzaifaAqeel/Agent-Red-Team-Eval"
Repository = "https://github.com/HuzaifaAqeel/Agent-Red-Team-Eval"
Issues = "https://github.com/HuzaifaAqeel/Agent-Red-Team-Eval/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/redteam_eval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/redteam_eval/attacks/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
